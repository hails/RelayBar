name: Build local arm64 app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-local
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun --show-sdk-version

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -project RelayBar.xcodeproj \
            -scheme RelayBar \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build arm64
        run: |
          set -euo pipefail
          xcodebuild \
            -project RelayBar.xcodeproj \
            -scheme RelayBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/RelayBar.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="dist/RelayBar-1.6.0-sparkle2.10.1-arm64.zip"
          ditto -c -k --keepParent build/Build/Products/Release/RelayBar.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          shasum -a 256 -c "$ZIP.sha256"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relaybar-local
          path: dist/*
          if-no-files-found: error
          retention-days: 14
